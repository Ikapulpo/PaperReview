name: Weekly Spine Newsletter

on:
  schedule:
    - cron: '0 23 * * 0'  # Every Sunday 23:00 UTC = Monday 08:00 JST
  workflow_dispatch:

jobs:
  spine-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[llm]"

      - name: Run spine pipeline
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SPINE_NOTION_DATABASE_ID: ${{ secrets.SPINE_NOTION_DATABASE_ID }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.cli spine run --days 7 --max-papers 50
